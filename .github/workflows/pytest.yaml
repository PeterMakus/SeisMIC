name: pytest
on: [push]
jobs:
  run:
    runs-on: ${{ matrix.os }}
    strategy:
        matrix:
            os: ["ubuntu-latest", "windows-latest"]
    env:
      PYTHON: '3.12'
    steps:
    - name: checkout
      uses: actions/checkout@v2
      with:
        fetch-depth: 0
        lfs: true
