name: pytest
on: [push]
jobs:
  run:
    runs-on: ubuntu-latest
    env:
      OS: ubuntu-latest
      PYTHON: '3.12'
    steps:
    - name: checkout
      uses: actions/checkout@v2
      with:
        fetch-depth: 0
        lfs: true

    # Cache Conda environment installattion
    - name: Cache conda
      uses: actions/cache@v4
      env:
        # Increase this value to reset cache if etc/example-environment.yml has not changed
        CACHE_NUMBER: 2
      with:
        path: ~/conda_pkgs_dir
        key:
          ${{ runner.os }}-conda-${{ env.CACHE_NUMBER }}-${{
          hashFiles('environment.yml') }}
    
    - name: Prepare Environment
      shell: bash {0}
      run: |
        python -m venv seismic_env
        source seismic_env/bin/activate
        pip install --upgrade pip
        pip install -r requirements.txt
        pip install -e .


    # To keep Conda activated you have to use 'shell: bash -l {0}' line
    # To specifiy the shell
    - name: run pytest
      shell: bash -l {0}
      run: |
        source seismic_env/bin/activate
        pip install pytest
        pytest tests

    - name: lint
      shell: bash -l {0}
      run: |
        source seismic_env/bin/activate
        pip install flake8
        python formatting_test/test_code_formatting.py