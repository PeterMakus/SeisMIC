name: CodeCov
on: [push, pull_request]
jobs:
  run:
    runs-on: ubuntu-latest
    env:
      OS: ubuntu-latest
      PYTHON: '3.12'
    steps:
    - name: checkout
      uses: actions/checkout@v2
      with:
        fetch-depth: ‘2’
    # Cache Conda environment installattion
    - name: Cache conda
      uses: actions/cache@v4
      env:
        # Increase this value to reset cache if etc/example-environment.yml has not changed
        CACHE_NUMBER: 2
      with:
        path: ~/conda_pkgs_dir
        key:
          ${{ runner.os }}-conda-${{ env.CACHE_NUMBER }}-${{
          hashFiles('environment.yml') }}
    
    # Setting Up Cache pip installations
    - name: Cache pip
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
          ${{ runner.os }}-
    - name: Prepare Environment
      shell: bash -l {0}
      run: |
        # Parse environment.yml to extract conda dependencies
        CONDA_DEPS=$(grep "^  - " environment.yml | \
        grep -v "pip:" | \
        sed 's/^  - //' | \
        tr '\n' ' ')
        
        # Create environment with --no-scripts to skip post-link issues
        conda create -n seismic --no-scripts -y -c conda-forge $CONDA_DEPS
        
        # Activate and install pip packages
        conda activate seismic
        pip install -q sphinx<6.0 pydata-sphinx-theme sphinx-copybutton sphinxcontrib-mermaid obspy==1.5
        pip install -q -e .

    # To keep Conda activated you have to use 'shell: bash -l {0}' line
    # To specifiy the shell
    - name: INFO using bash shell
      shell: bash -l {0}
      run: |
        conda info
        conda list

    - name: Generate Report
      shell: bash -l {0}
      run: |
        pip install pytest-cov
        pytest tests --cov=./ --cov-report=xml

    - name: Upload Coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        fail_ci_if_error: false